name: Compile LaTeX document

on:
  push:
    branches:
      - main

jobs:
  build-and-commit-pdf:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Setup TeX Live
      uses: teatimeguest/setup-texlive-action@v3
      with:
        packages: >
          latexmk
          scheme-small
          tcolorbox
          cfr-lm
          fontawesome5

    - name: Compile main.tex
      run: latexmk -pdf -interaction=nonstopmode main.tex

    - name: Copy PDF to repo
      run: cp main.pdf DH_resume.pdf

    - name: Commit PDF
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add DH_resume.pdf
        git commit -m "Add compiled PDF" || echo "No changes to commit"
        git push
